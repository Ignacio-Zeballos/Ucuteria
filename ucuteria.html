<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ucuteria</title>
    <link rel="shortcut icon" href="static/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="ucuteria.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart" />

</head>
<body>
    <header class="header">
        <div id="div1">
            <img id="logo" src="static/logoucu.png" alt="Logo ucu">
        </div>
        <div id="div2">
            <h1 id="titulo">Cafetería UCU</h1>
        </div>
        <div id="div3">
            <button id="oscuro">🌙</button>
            <button id="carrito"><span class="material-symbols-outlined">shopping_cart </span></button>
        </div>
    </header>
</span>
    <main>
        <section id="controles">
            <input type="text" id="busqueda" placeholder="Buscar producto...">
        <div id="filtro" class="filtro">
            <button>Todos</button>
            <button>Café</button>
            <button>Té</button>
            <button>Pastelería</button>
            <button>Sándwiches</button>
        </div>
                <select id="ordenar">
            <option>Ordenar por...</option>
            <option>Precio ↑</option>
            <option>Precio ↓</option>
            <option>Nombre A-Z</option>
            <option>Nombre Z-A</option>
        </select>
        </section>
    </main>

    <aside id="carritoPanel" class="carrito-panel">
        <h2>Mi Carrito</h2>

        <ul id="listaCarrito"></ul>

        <div class="cupon">
            <label for="cupon">Cupón:</label>
            <input type="text" id="cupon" placeholder="Ingresar cupón">
            <button id="aplicarCupon">Aplicar</button>
        </div>

        <p id="subtotal">Subtotal: $0</p>
        <p id="iva">IVA (22%): $0</p>
        <p id="envio">Envío: $0</p>
        <h3 id="total">Total: $0</h3>

        <button id="vaciarCarrito">Vaciar carrito</button>
    </aside>

    <footer>
        <div>
            <ul>
                <li><a href="">Nosotros</a></li>
                <li><a href="">Contactanos</a></li>
                <li><a href="">Ubicación</a></li>
            </ul>
            
        </div>
    </footer>
</body>
</html>
